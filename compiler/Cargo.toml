[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
gameplay-catalog = { path = "../crates/gameplay-catalog" }
engine-logger = { path = "../crates/logger" }
engine-core = { path = "../crates/engine-core" }
bridge = { path = "../crates/bridge" }
sha2 = "0.10"
serde_json = "1"
gltf = { version = "1.4.1", default-features = false, features = ["names"] }
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
