[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-core = { path = "../engine-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
gltf = "1.4.1"
base64 = "0.13.1"
urlencoding = "2.1.3"
engine-logger = { path = "../logger" }
bridge = { path = "../bridge" }
renderer = { path = "../renderer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
glam = "0.33.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_XboxController"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
