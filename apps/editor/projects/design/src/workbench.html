<main>
    <h1>Components</h1>
    @for (section of sections(); track section.id) {
        <section [attr.aria-labelledby]="'design-' + section.id">
            <h2 [id]="'design-' + section.id">{{ section.title }}</h2>
            @if (section.component; as component) {
                <ng-container
                        [ngComponentOutletInputs]="section.inputs ?? {}"
                        [ngComponentOutlet]="component"
                />
            } @else if (section.message) {
                <p>{{ section.message }}</p>
            }
        </section>
    } @empty {
        <p>No shared component folders.</p>
    }
</main>
