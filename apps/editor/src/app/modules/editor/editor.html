<main class="editor-main">
    <editor-header
            [canGoBack]="workspace.canGoBack()"
            [canGoForward]="workspace.canGoForward()"
            (backRequested)="navigateWorkspace('back')"
            (forwardRequested)="navigateWorkspace('forward')"
            (exitRequested)="exitEditor()"
            (openProjectRequested)="openProject()"
            (objectActionRequested)="workspace.runObjectAction($event)"
            (sceneInformationRequested)="workspace.openSceneInformation()"
            (newSceneRequested)="workspace.openNewScene()"
            [canCreateScene]="workspace.canCreateScene()"
            (sceneFlowRequested)="workspace.openSceneFlow()"
            (controlsRequested)="workspace.openControls()"
            (physicsLayersRequested)="workspace.openPhysicsLayers()"
            (projectSetupRequested)="openProjectSetup($event)"
            (settingsRequested)="settings.setOpen(true)"
            [canExit]="canExit()"
            [canOpen]="canOpenProject()"
            [canOpenControls]="workspace.canOpenControls()"
            [availableObjectActions]="workspace.availableObjectActions()"
            [objectActionsEnabled]="workspace.objectActionsEnabled()"
            [canOpenSettings]="!opening()"
            [opening]="opening()"
    />

    <div [class.has-message]="opening()" class="open-status" role="status">{{ openMessage() }}</div>

    @if (openError(); as message) {
        <div class="open-error" role="alert">
            <span>{{ message }}</span>

            <button (click)="openError.set(null)" type="button">
                Dismiss
            </button>
        </div>
    }

    <editor-document-recovery/>

    <editor-workspace #workspace
            (openProjectRequested)="openProject()"
            [canOpenProject]="canOpenProject()"
            [opening]="opening()"
    />
    <editor-footer [projectName]="editorService.snapshot()?.project.name ?? null"/>
</main>

<editor-portal>
    <router-outlet></router-outlet>
</editor-portal>

<editor-settings-dialog [sceneWarmingSupported]="editorService.capabilities()?.scene_warming_supported === true"/>
<editor-context-menu/>
