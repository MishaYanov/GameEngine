<header>
    <div class="editor-menus">
        <editor-file-menu
                (exitRequested)="exitRequested.emit()"
                (openProjectRequested)="openProjectRequested.emit()"
                (projectSetupRequested)="projectSetupRequested.emit($event)"
                (settingsRequested)="settingsRequested.emit()"
                [canExit]="canExit()"
                [canOpenSettings]="canOpenSettings()"
                [canOpen]="canOpen()"
                [opening]="opening()"
        />

        <button #gameTrigger class="game-trigger" popovertarget="editor-game-menu" type="button">Game</button>
        <div #gameMenu class="game-menu" id="editor-game-menu" popover>
            <button
                    (click)="gameMenu.hidePopover(); gameTrigger.focus(); sceneInformationRequested.emit()"
                    [disabled]="opening() || !editorService.snapshot()"
                    aria-haspopup="dialog"
                    autofocus
                    type="button"
            >Scene Information…
            </button>
            <button
                    (click)="gameMenu.hidePopover(); gameTrigger.focus(); physicsLayersRequested.emit()"
                    [disabled]="opening() || editorService.snapshot()?.mode !== 'edit'"
                    aria-haspopup="dialog"
                    type="button"
            >Physics Layers…
            </button>
        </div>
        <button #controlsTrigger class="controls-trigger" type="button" aria-haspopup="dialog"
                [disabled]="opening() || !canOpenControls()"
                (click)="controlsTrigger.focus(); controlsRequested.emit()">Controls</button>
        <button #objectsTrigger (click)="openObjects(objectsTrigger)" (keydown)="openObjectsFromKeyboard($event, objectsTrigger)" [attr.aria-expanded]="contextMenu.request()?.owner === objectsTrigger"
                [disabled]="opening() || !availableObjectActions().length"
                aria-haspopup="menu"
                class="objects-trigger"
                type="button">Objects <span aria-hidden="true">▾</span></button>
    </div>

    <div class="breadcrumb">
        <span class="workspace-label">Workspace</span>
        <span aria-hidden="true" class="workspace-label">/</span>

        <h1 [title]="editorService.snapshot()?.project?.name ?? 'Editor'">
            {{ editorService.snapshot()?.project?.name ?? 'Editor' }}
        </h1>

        @if (editorService.snapshot()?.dirty) {
            <span class="dirty-label">Unsaved changes</span>
        }
    </div>
</header>
