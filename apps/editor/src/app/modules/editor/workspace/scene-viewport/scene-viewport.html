<section [attr.aria-label]="label()" class="viewport">
    @if (nativeAvailable) {
        <div
            #surface
            #viewport="engineViewport"
            (engineViewportError)="failed($event)"
            (engineViewportInput)="viewportInput.emit($event)"
            (engineViewportStatus)="statusChanged($event)"
            [engineViewport]="active()"
            class="surface"
        ></div>
        @if (error(); as message) {
            <p class="error" role="alert">{{ message }}</p>
        }
    } @else {
        <div class="fallback">
            <editor-icon name="cube"/>
            <p>Vulkan viewport</p>
            <span>Available in the desktop editor</span>
            <ng-content select="[viewport-fallback]"/>
        </div>
    }
</section>
