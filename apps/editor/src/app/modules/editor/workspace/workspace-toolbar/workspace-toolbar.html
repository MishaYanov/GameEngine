<div aria-label="Workspace actions" class="workspace-actions" role="group">
    <div aria-label="Scene edits" class="action-group" role="group">
        <button (click)="dispatch('save')" [disabled]="!canPerform('save')" type="button">
            Save Scene
        </button>
        <button (click)="dispatch('saveAll')" [disabled]="!canPerform('saveAll')" type="button">
            Save All
        </button>
        <button (click)="dispatch('undo')" [disabled]="!canPerform('undo')"
                type="button">
            Undo
        </button>
        <button (click)="dispatch('redo')" [disabled]="!canPerform('redo')"
                type="button">
            Redo
        </button>
    </div>
    <div aria-label="Selected entities" class="action-group" role="group">
        <button (click)="dispatch('duplicate')" [disabled]="!canPerform('duplicate')" type="button">Duplicate</button>
        <button (click)="dispatch('deleteSelection')" [disabled]="!canPerform('deleteSelection')" type="button">Delete
        </button>
        <button (click)="dispatch('frameSelection')" [disabled]="!canPerform('frameSelection')" type="button">Frame
            Selection
        </button>
    </div>
    <div aria-label="Game preview controls" class="action-group" role="group">
        <button (click)="dispatch('play')" [disabled]="!canPerform('play')" class="play-action" type="button">
            <editor-icon name="play"/>
            Play
        </button>
        <button (click)="dispatch('stop')" [disabled]="!canPerform('stop')" type="button">
            Stop
        </button>
    </div>
    <div aria-label="Command palette" class="action-group" role="group">
        <button (click)="paletteRequested.emit()" [disabled]="!paletteAvailable()"
                [title]="paletteShortcut" aria-haspopup="dialog"
                aria-keyshortcuts="Control+Shift+P Meta+Shift+P" type="button">Commands
        </button>
    </div>
</div>
@if (actionError(); as message) {
    <div class="action-error" role="alert">{{ message }}</div>
}
