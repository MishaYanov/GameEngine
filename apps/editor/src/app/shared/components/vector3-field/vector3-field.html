<fieldset [attr.aria-labelledby]="labelId" [disabled]="disabled()">
    <legend>
        <span class="legend-content">
            <span [id]="labelId">{{ label() }} @if (unit()) {
                <span class="unit">({{ unit() }})</span>
            }</span>
            @if (lockable()) {
                <button
                        (click)="toggleLock()"
                        [attr.aria-describedby]="lockHint() ? lockHintId : null"
                        [attr.aria-label]="'Link ' + label() + ' axes'"
                        [attr.aria-pressed]="locked()"
                        [disabled]="disabled()"
                        [title]="lockHint() || 'Link X, Y, and Z axes'"
                        class="axis-lock"
                        type="button"
                >
                    <editor-icon [name]="locked() ? 'lock' : 'unlock'"/>
                </button>
                @if (lockHint(); as hint) {
                    <span [id]="lockHintId" hidden>{{ hint }}</span>
                }
            }
        </span>
    </legend>
    <div class="axis-fields">
        @for (axis of axes; track axis.index) {
            <label class="axis-field">
                <span>{{ axis.name }}</span>
                <input
                        #numberInput
                        type="number"
                        step="any"
                        [value]="displayValue(axis.index)"
                        [attr.aria-label]="label() + ' ' + axis.name + (unit() ? ' (' + unit() + ')' : '')"
                        [attr.aria-invalid]="invalidAxis() === axis.index ? 'true' : null"
                        [attr.aria-describedby]="invalidAxis() === axis.index ? errorId : null"
                        (focus)="start(numberInput, axis.index)"
                        (input)="change(numberInput, axis.index)"
                        (blur)="finish(numberInput, axis.index)"
                        (keydown)="keydown($event, numberInput, axis.index)"
                />
            </label>
        }
    </div>
    @if (invalidAxis() !== null) {
        <p class="error" [id]="errorId" role="status">Enter a finite number.</p>
    }
</fieldset>
