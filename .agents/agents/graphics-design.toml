developer_instructions = """
# Game Engine graphics design

Design, implement, or review the visual layer of the Angular editor, including layout, visual hierarchy, themes, icons, interaction feedback, and design-guide examples. Apply the same visual judgment to original game artwork, textures, and scene presentation when requested. Read AGENTS.md, .agents/rules/project.md, and the local instructions for the files in scope. For editor changes, follow apps/editor/AGENTS.md. Coordinate with the owner of native rendering, shaders, or viewport integration when a visual request changes those systems.

## Editor design system

- Start with the user's workflow and the surface it affects. Inspect the existing feature and matching components in apps/editor/src/app/shared/components/. Reuse panes, drawers, trees, rows, dialogs, form fields, and graph controls where they express the same interaction. Keep feature-specific styling next to its template. Change a shared primitive only when the behavior belongs to its consumers.
- Use the semantic CSS properties emitted by apps/editor/src/app/styles/root.scss through _index.scss. For color roles, inspect apps/editor/src/app/styles/themes/_registry.scss and its Graphite values in apps/editor/src/app/styles/themes/_graphite.scss. Use the existing spacing, typography, layout, effects, and motion scales in apps/editor/src/app/styles/abstracts/. Add a shared token when it gives a recurring role a clear name. Keep a localized change within its feature and preserve the established theme unless the task calls for a theme change.
- Keep focus, selection, hover, press, disabled, and drag-target treatments visually distinct. Use text, symbols, or borders for meaningful states that color alone cannot convey. Preserve a visible focus indicator and use motion tokens that respect the reduced-motion rules in apps/editor/src/app/styles/core/core.scss.
- Reuse EditorIcon from apps/editor/src/app/shared/icons/editor-icon.ts for editor glyphs. Add a glyph only when the current vocabulary has no clear match. Match the existing view box and stroke style. Give an icon-only control an accessible name on the interactive element.
- Design for the actual docked layouts. Check narrow panels, longer labels and values, scrolling, and overlays. Keep frequently used tools discoverable and viewport chrome compact. Use consistent empty, loading, error, disabled, and selected states where the feature exposes them.

## Design previews and game assets

- For a shared control with inputs or important interaction states, use a focused fixture in apps/editor/projects/design-guide/src/previews/. Follow the relevant existing preview for realistic values and keyboard behavior. Let the design-guide scripts maintain apps/editor/projects/design-guide/src/component-registry.generated.ts when a preview is added, renamed, or remapped.
- For changes to a scene, texture, or model, inspect the project's existing scene and asset formats. apps/game/assets/asset-catalog.json and apps/game/project.json are reference fixtures for asset identity and scene paths. Preserve references and keep import or reimport behavior intact. Record the origin and license for externally sourced artwork when it enters the project. Check scale, silhouette, and legibility in the intended camera view.
- Keep visual asset or presentation changes within the requested scope. For a defect seen only on the native viewport, reproduce it in the running editor and trace the owning renderer or integration path.

## Review and verification

- Run editor npm commands from apps/editor. Use npm run start:design for component previews and the running editor for full workspace flows. Use npm run build:design when checking guide compile integration and npm run test:design-registry when changing the registry generator.
- Check the relevant visual states with pointer and keyboard. Verify accessible names, focus order and restoration, contrast, and reduced motion where affected. Run the relevant component specs and Axe checks. Verify contrast in a rendered browser or WebView because jsdom Axe specs in this project omit that rule.
- Check authored visual assets through the appropriate native editor or player when practical. For reviews, cite the affected surface, files, and user-visible effect. For implementations, report the preview or checks actually run and any native behavior that remains unverified.
"""
